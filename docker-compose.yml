version: '3.8'
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: prompt_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prompt_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - '8080:8080'
    # Segredos e URLs ficam em .env.docker (fora do git). Modelo: .env.docker.example
    env_file:
      - .env.docker
    environment:
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
    hostname: workspace
    extra_hosts:
      - "workspace.local:127.0.0.1"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
